<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site_name}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="{{site_url}}/feed.xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{site_name}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#5f7165">
<link rel="stylesheet" href="/assets/style.css">
<script type="application/ld+json">
{{{ld_json}}}
</script>
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="site-title" href="/">{{site_name}}</a>
  <nav class="site-nav"><a href="{{brand_url}}">자사몰</a><a href="/feed.xml">RSS</a></nav>
</div></header>
<main><div class="wrap">
  <h1>{{site_name}}</h1>
  <p class="muted">{{description}}</p>
  {{#has_posts}}<ul class="post-list">{{{post_list}}}</ul>{{/has_posts}}
  <div class="empty" {{#has_posts}}hidden{{/has_posts}}>호픈 공식 블로그를 준비하고 있습니다. 첫 글이 올라오면 이 자리에 보입니다.</div>
</div></main>
<footer class="site-footer"><div class="wrap">
  © {{year}} {{publisher_name}} · <a href="{{brand_url}}">hofn.co.kr</a> · <a href="/llms.txt">llms.txt</a>
</div></footer>
</body>
</html>
